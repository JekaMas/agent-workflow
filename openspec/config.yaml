schema: spec-driven

# Rendered from pinned shared templates and project profile; do not edit directly.
context: |
  Reusable local workflow tooling. Preserve scope, authority and evidence limits.

rules:
  proposal:
    - State intent, relevant outcomes, non-goals and affected capabilities; inspect related existing specs before adding one.
    - Record material scope/authority questions, not routine implementation choices; do not require approval merely because this artifact exists.
  specs:
    - Before semantic implementation, challenge intent, ambiguity, contradictions, missing cases and oracle adequacy using the shared verification procedure routed by skills/verification-design/SKILL.md; this is not an automatic approval gate.
    - Express observable requirements and meaningful positive, invalid and boundary scenarios; identify the required evidence or oracle for important invariants.
    - Preserve integer precision, serialization, error, version and recovery semantics at mixed-language boundaries; state unsupported cases explicitly.
    - For every behavioral requirement, create or update the change-owned verification.json DAG before semantic implementation. Pin exact requirements/scenarios to properties and every property/scenario edge to distinct positive and negative cases. Each case names exactly one scenario fingerprint, setup, observable, red and green expectations, exact observed test identity, test-source fingerprint, deduplicated command, substitution and invalidation dependencies.
    - Map requirements and evidence in both directions; a shared test needs explicit distinct observable edges and duplicate property/polarity/observable/test edges are invalid.
    - For behavioral discovery, keep discovery.json scoped to the relevant verification properties and exact tests. Record exact, semantic Context and capability-aware JetBrains-index search lanes, classify every result and choose current change, named new change, validation only or no change before accepting scope.
    - Do not substitute model agreement, simulated time or downstream rejection for a stronger requested contract.
  design:
    - Record consequential choices, dependencies, risks, assumptions, approval boundaries and rationale; link evidence rather than duplicate requirements or tasks.
    - Connect important requirements to actual implementation owners, independent oracles and evidence; inspect each material delta for an authorized purpose. Use skills/verification-design/SKILL.md as relevant.
    - Link a proportionate validation contract from existing artifacts using skills/verification-design/SKILL.md. Distinguish required checks from optional experiments and record adapter/model bounds; select existing tools by concrete risk.
    - Revisit decisions when evidence changes the approach within intent; ask only for material decisions, incompatible requirements, weaker acceptance or expanded authority.
  tasks:
    - Keep this the sole authoritative checklist, with stable numbered checkboxes and a completion check or evidence link per task.
    - Group useful increments by outcome or uncertainty reduction. Detail the next increment and keep later work coarse until evidence supports detail; no fixed iteration count or mandatory tiny slices.
    - Record only relevant objective, requirements, dependencies, assumptions/risks, work and required evidence. Investigation, prototypes, models and harnesses may be legitimate increments.
    - At an increment boundary inspect results, update affected artifacts and select the next useful action. Keep concise resume notes here; partial progress is not completion.
    - Never mark a required unavailable, failed, timed-out, unsupported, unintentionally zero-selected or skipped check as passed; retain commands, scope, working directory, versions, results and bounded artifact links.

operations:
  apply:
    guidance:
      - Follow docs/maintenance.md. Continue through useful authorized implementation, inspection, repair and affected revalidation without asking whether to continue.
      - Replan within the same intent as evidence changes. Update specs/design/tasks coherently; a materially different intent or independently deliverable scope needs a separate change proposal, not silent scope growth.
      - First complete independent authorized work before asking for a missing material decision or permission. Record exact blockers and unblock actions; do not turn a checkpoint or debugging result into task completion.
      - Recheck the affected specification and validation contract before semantic implementation; revise artifacts within scope when evidence changes.
      - Qualify decisive feedback and retain material failure/replay evidence using skills/verification-design/SKILL.md. Verify the whole requested outcome before no-change completion; a partial fix or passing retry is insufficient.
      - Review actual code and evidence using skills/verification-design/SKILL.md. Repair material in-scope findings and revalidate affected results; a review stage is not a handoff or task completion. Do not claim independent review for self-review.
      - Reconcile required properties and selected test sets with actual executed cases/families, skips, configurations and gaps using skills/verification-design/SKILL.md. Manifest validity is not execution or oracle evidence.
      - Query and run the verification.json closure for every affected requirement, property, owner or source path in the increment. Confirm each expected exact test identity executed and passed; preserve failures and gaps.
      - After each edit run only the smallest directly invalidated cases, then expand to dependent or sibling cases when required. Reuse green evidence until a declared invalidation dependency changes, and run the complete iteration case set once at the stable iteration boundary.
      - Validate discovery.json for the affected property/test selection before accepting explore/check scope decisions. Unavailable semantic or IDE search is recorded with its exact reason, never silently substituted.
      - Execute relevant existing commands through docs/maintenance.md; users need not invoke Make separately. Select the documented workflow, specification and readiness checks plus required behavioral evidence. Missing checks are not passes.
      - Use relevant domain skills and risk-based local checks. Read-only audit stopping applies only to audit scope; it does not limit an authorized implementation workflow.
      - DONE includes verified no-change completion and requires the requested outcome, matching artifacts, a passing complete verification.json run --all on the final relevant code, diff/behavior inspection and resolved material findings. Report limitations and separate local completion from external approval/deployment.
  archive:
    guidance:
      - Archive only after the DONE evidence review in docs/maintenance.md; artifact readiness, checkbox totals and a verification summary alone are insufficient.
      - Inspect pending tasks, required evidence and unresolved findings. Do not force or bypass incomplete work into an archive. Inspect the proposed spec synchronization and preserve unrelated active changes.
      - Archival records completion; it does not execute deployment/publication or grant external authority. Retain a bounded evidence and resume/history pointer.
